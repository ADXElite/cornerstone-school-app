<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cornerstone Admin</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#E4010D">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--red:#E4010D;--ink:#141213;--bg:#F6F4F4;--surface:#fff;--muted:#6B6466;--line:#E4DFDF;--chip:#FBE9EA;--chip-ink:#A0000A;--ok:#1E7A46;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--body:"Source Sans 3","Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--red:#F2222D;--ink:#F3EFEF;--bg:#121011;--surface:#1D1A1B;--muted:#A69EA0;--line:#322D2E;--chip:#3A1416;--chip-ink:#FF8C92;--ok:#5BC98A;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.top{background:var(--red);color:#fff;padding-top:env(safe-area-inset-top,0px)}
.top-in,main{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{padding-block:14px;display:flex;align-items:center;gap:12px}
.top b{font-family:var(--display);font-size:1.4rem;letter-spacing:.03em;text-transform:uppercase;flex:1}
.top a,.top button{color:#fff;background:rgba(0,0,0,.2);border:0;border-radius:999px;padding:6px 12px;font:inherit;font-weight:600;font-size:.85rem;text-decoration:none;cursor:pointer}
main{padding-block:20px 60px;display:grid;gap:22px}
h1{font-family:var(--display);font-size:1.9rem;text-transform:uppercase;margin:0;line-height:1.05}
h2{font-family:var(--display);font-size:1.05rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
label{display:grid;gap:4px;font-weight:600;font-size:.9rem}
input,textarea,select{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
textarea{min-height:80px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.two{grid-template-columns:1fr}}
.check{display:flex;gap:8px;align-items:center;font-weight:600}
.check input{width:auto}
.btn{background:var(--red);color:#fff;border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer;justify-self:start}
.btn:disabled{opacity:.6}
.link{background:none;border:0;color:var(--red);font:inherit;font-weight:700;cursor:pointer;padding:4px 0}
.tabs{display:flex;gap:8px}
.tabs button{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px;font:inherit;font-weight:700;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;gap:12px;padding:12px 14px;border-top:1px solid var(--line);align-items:flex-start}
.row:first-child{border-top:0}
.row .t{flex:1;min-width:0}
.row b{display:block}
.row small{color:var(--muted)}
.row p{margin:2px 0 0;color:var(--muted);font-size:.92rem;overflow-wrap:anywhere}
.del{border:1px solid var(--line);background:var(--bg);color:var(--chip-ink);border-radius:8px;padding:5px 10px;font:inherit;font-size:.82rem;font-weight:700;cursor:pointer}
.del.confirm{background:var(--red);color:#fff;border-color:var(--red)}
.msg{border-radius:10px;padding:10px 12px;font-weight:600;font-size:.92rem;background:var(--chip);color:var(--chip-ink)}
.msg.ok{background:transparent;border:1.5px solid var(--ok);color:var(--ok)}
.muted{color:var(--muted)}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
</style>
</head>
<body>
<header class="top"><div class="top-in"><b>Cornerstone Admin</b><a href="/">Back to app</a><button id="signout" hidden>Sign out</button></div></header>
<main>

<section id="login" class="card" hidden>
  <h1>Staff sign-in</h1>
  <p class="muted">Sign in to post announcements and calendar events to the Cornerstone app.</p>
  <form id="login-form" class="card" style="border:0;padding:0">
    <label for="li-email">School email<input id="li-email" type="email" autocomplete="username" required></label>
    <label for="li-pass">Password<input id="li-pass" type="password" autocomplete="current-password" required></label>
    <button class="btn" id="li-btn">Sign in</button>
  </form>
  <div id="li-msg" class="msg" hidden></div>
</section>

<section id="noaccess" class="card" hidden>
  <h1>No posting access</h1>
  <p>You're signed in as <b id="na-email"></b>, but this account isn't on the posting list. Ask the school office to add you.</p>
</section>

<section id="panel" hidden>
  <div style="display:grid;gap:22px">
    <div><h1>Post an update</h1><p class="muted" id="who"></p></div>
    <div class="tabs" role="group" aria-label="What to post">
      <button id="t-ann" aria-pressed="true" data-t="ann">Announcement</button>
      <button id="t-ev" aria-pressed="false" data-t="ev">Calendar event</button>
    </div>

    <form id="ann-form" class="card">
      <label for="a-title">Title<input id="a-title" required maxlength="120" placeholder="Picture Day is Tuesday"></label>
      <label for="a-body">Details<textarea id="a-body" maxlength="600" placeholder="Students should wear their dress uniform."></textarea></label>
      <label for="a-link">Link (optional)<input id="a-link" type="url" placeholder="https://www.csjax.org/..."></label>
      <div class="two">
        <label for="a-aud">Who sees it<select id="a-aud"><option value="all">Everyone</option><option value="parent">Parents only</option><option value="staff">Staff only</option></select></label>
        <label for="a-exp">Remove after (optional)<input id="a-exp" type="date"></label>
      </div>
      <label class="check" for="a-pin"><input id="a-pin" type="checkbox"> Pin to the top</label>
      <button class="btn">Post announcement</button>
    </form>

    <form id="ev-form" class="card" hidden>
      <label for="e-title">Event<input id="e-title" required maxlength="120" placeholder="Fall Festival"></label>
      <div class="two">
        <label for="e-date">Date<input id="e-date" type="date" required></label>
        <label for="e-time">Time (optional)<input id="e-time" maxlength="40" placeholder="6:00 – 8:00 PM"></label>
      </div>
      <div class="two">
        <label for="e-grades">Grades<input id="e-grades" maxlength="60" placeholder="All grades"></label>
        <label for="e-aud">Who sees it<select id="e-aud"><option value="all">Everyone</option><option value="parent">Parents only</option><option value="staff">Staff only</option></select></label>
      </div>
      <button class="btn">Add event</button>
    </form>
    <div id="p-msg" class="msg" hidden></div>

    <div><h2>Announcements</h2><div class="list" id="ann-list"></div></div>
    <div><h2>Upcoming events</h2><div class="list" id="ev-list"></div></div>
  </div>
</section>
</main>

<script>
const sb=supabase.createClient('https://cvvdwhgdiqnoqgxtgzfw.supabase.co','sb_publishable_hnUHrqYS2un679djbzsXxg_oLYDQDp0');
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const AUD={all:'Everyone',parent:'Parents',staff:'Staff'};
function show(id){['login','noaccess','panel'].forEach(x=>$('#'+x).hidden=x!==id);$('#signout').hidden=id==='login'}
function flash(el,text,ok){el.textContent=text;el.className='msg'+(ok?' ok':'');el.hidden=false;clearTimeout(el._t);el._t=setTimeout(()=>el.hidden=true,4000)}
const fmtDate=d=>new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});

async function route(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){show('login');return}
  const {data:isAdmin}=await sb.rpc('is_admin');
  if(!isAdmin){$('#na-email').textContent=session.user.email;show('noaccess');return}
  $('#who').textContent='Signed in as '+session.user.email+'. Posts appear in the app right away.';
  show('panel');loadLists();
}

$('#login-form').addEventListener('submit',async e=>{
  e.preventDefault();$('#li-btn').disabled=true;
  const {error}=await sb.auth.signInWithPassword({email:$('#li-email').value.trim().toLowerCase(),password:$('#li-pass').value});
  $('#li-btn').disabled=false;
  if(error){flash($('#li-msg'),'That email and password didn\'t match. Check them and try again, or ask the office to reset your password.');return}
  route();
});
$('#signout').addEventListener('click',async()=>{await sb.auth.signOut();show('login')});

document.querySelectorAll('[data-t]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('[data-t]').forEach(x=>x.setAttribute('aria-pressed',x===b));
  $('#ann-form').hidden=b.dataset.t!=='ann';$('#ev-form').hidden=b.dataset.t!=='ev';
}));

$('#ann-form').addEventListener('submit',async e=>{
  e.preventDefault();
  const row={title:$('#a-title').value.trim(),body:$('#a-body').value.trim(),link:$('#a-link').value.trim()||null,audience:$('#a-aud').value,pinned:$('#a-pin').checked,expires_on:$('#a-exp').value||null};
  const {error}=await sb.from('announcements').insert(row);
  if(error){flash($('#p-msg'),'Not posted: '+error.message);return}
  e.target.reset();flash($('#p-msg'),'Announcement posted.',true);loadLists();
});
$('#ev-form').addEventListener('submit',async e=>{
  e.preventDefault();
  const row={title:$('#e-title').value.trim(),event_date:$('#e-date').value,time_label:$('#e-time').value.trim()||null,grades:$('#e-grades').value.trim()||null,audience:$('#e-aud').value};
  const {error}=await sb.from('events').insert(row);
  if(error){flash($('#p-msg'),'Not added: '+error.message);return}
  e.target.reset();flash($('#p-msg'),'Event added to the calendar.',true);loadLists();
});

async function loadLists(){
  const today=new Date().toISOString().slice(0,10);
  const [{data:ann},{data:ev}]=await Promise.all([
    sb.from('announcements').select('*').order('pinned',{ascending:false}).order('publish_on',{ascending:false}).limit(50),
    sb.from('events').select('*').gte('event_date',today).order('event_date').limit(100)
  ]);
  $('#ann-list').innerHTML=(ann||[]).map(a=>`<div class="row"><div class="t"><b>${esc(a.title)}</b><small>${AUD[a.audience]}${a.pinned?' · Pinned':''}${a.expires_on?' · until '+fmtDate(a.expires_on):''}</small>${a.body?`<p>${esc(a.body)}</p>`:''}</div><button class="del" data-del="announcements:${a.id}">Remove</button></div>`).join('')||'<div class="row muted">No announcements yet.</div>';
  $('#ev-list').innerHTML=(ev||[]).map(x=>`<div class="row"><div class="t"><b>${esc(x.title)}</b><small>${fmtDate(x.event_date)}${x.time_label?' · '+esc(x.time_label):''} · ${esc(x.grades||'All grades')} · ${AUD[x.audience]}</small></div><button class="del" data-del="events:${x.id}">Remove</button></div>`).join('')||'<div class="row muted">No upcoming events.</div>';
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-del]');if(!b)return;
  if(!b.classList.contains('confirm')){b.classList.add('confirm');b.textContent='Tap to confirm';setTimeout(()=>{b.classList.remove('confirm');b.textContent='Remove'},3000);return}
  const [table,id]=b.dataset.del.split(':');
  const {error}=await sb.from(table).delete().eq('id',id);
  if(error){flash($('#p-msg'),'Not removed: '+error.message);return}
  flash($('#p-msg'),'Removed.',true);loadLists();
});
route();
</script>
</body>
</html>
