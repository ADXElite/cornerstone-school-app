<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
:root{--red:#E4010D;--ink:#141213;--muted:#6B6466;--line:#E4DFDF;--ok:#1E7A46;--bg:#fff}
body{margin:0;width:340px;font:14px/1.4 "Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
header{background:#141213;color:#fff;padding:10px 14px;border-bottom:3px solid var(--red);font-weight:700;letter-spacing:.03em;text-transform:uppercase;font-size:13px}
section{padding:12px 14px;border-bottom:1px solid var(--line)}
.status b{display:block;font-size:15px}
.ok{color:var(--ok)} .err{color:var(--red)}
.muted{color:var(--muted);font-size:12px}
button{background:var(--red);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer;width:100%}
button:disabled{opacity:.6;cursor:default}
button.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:600}
label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0}
input[type=time]{font:inherit}
input[type=password]{font:inherit;width:100%;box-sizing:border-box;padding:6px;border:1px solid var(--line);border-radius:6px}
details summary{cursor:pointer;font-weight:600}
ul{margin:6px 0 0;padding:0;list-style:none;max-height:160px;overflow:auto}
li a{color:var(--ink);font-size:12px}
</style>
</head>
<body>
<header>Cornerstone Dismissal Sync</header>
<section class="status" id="status">Loading…</section>
<section><button id="run">Run now</button></section>
<section>
  <details id="boards"><summary>Board links</summary><ul id="list"></ul>
  <p class="muted"><a href="#" id="all">Open the list of all boards</a></p></details>
</section>
<section>
  <details><summary>Settings</summary>
    <label>Daily pull time <input type="time" id="time"></label>
    <label><span>School days only (Mon–Fri)</span><input type="checkbox" id="weekdays"></label>
    <label><span>Re-sync every 1 min after</span><input type="checkbox" id="recheck"></label>
    <label>…until <input type="time" id="until"></label>
    <p class="muted" style="margin:8px 0 4px">Upload key</p>
    <input type="password" id="key" placeholder="Paste the upload key">
    <p style="margin-top:10px"><button class="secondary" id="save">Save settings</button></p>
    <p class="muted" id="saved"></p>
  </details>
</section>
<section class="muted">Chrome must be open on this computer and signed in to KidAccount. If Chrome is closed at the pull time, it runs as soon as Chrome opens (until 5 PM).</section>
<script src="config.js"></script>
<script src="popup.js"></script>
</body>
</html>
